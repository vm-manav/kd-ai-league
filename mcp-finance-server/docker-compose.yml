services:
  mcp-finance-server:
    build: .
    container_name: mcp-finance-server
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - redis
      - keycloak

  redis:
    image: redis:7-alpine
    container_name: mcp-finance-redis
    ports:
      - "6379:6379"

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.3
    container_name: mcp-finance-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
